version: "3"

tasks:
  generate:
    desc: Regenerate embedded asset files from source PNGs
    dir: nodes/assets
    cmds:
      - go generate

  generate:azure:
    desc: Regenerate only Azure embedded asset files
    dir: nodes/assets
    cmds:
      - go run github.com/UnnoTed/fileb0x ./b0x-azure.yml

  test:
    desc: Run tests
    cmds:
      - go test ./...

  clean:
    desc: Clean generated files
    cmds:
      - rm -rf nodes/assets/b0xfile_*.go nodes/assets/b0x.go

  help:
    desc: Show available tasks
    cmds:
      - task --list
